---
launch:
  # Deprecated compatibility aliases. Prefer replay_id in new commands.
  - arg: {name: scene_id, default: 'acl_jackal', description: 'Deprecated alias for replay_id'}
  - arg: {name: dataset_id, default: "$(var scene_id)", description: 'Deprecated alias for replay_id'}
  - arg: {name: replay_id, default: "$(var dataset_id)", description: 'Replay preset id and bag topic namespace'}
  - arg: {name: robot_name, default: 'acl_jackal2', description: 'The actual robot used when acquiring data' }

  # Frames
  # NOTE(hlim): In 12_08 bags, some robots need
  # `lidar_frame` - ouster_link,  `imu_frame` - ouster_link
  - arg: {name: lidar_frame, default: 'velodyne_link'}
  - arg: {name: imu_frame,   default: 'forward_imu_optical_frame'}
  - arg: {name: map_frame,   default: 'odom'}
  - arg: {name: base_frame,  default: 'base_link'}

  # TODO(hlim): To be generalized
  # - arg: {name: config_path, default: $(find-pkg-share s_slam_replay)/config/spark_fast_lio/kimera_multi/acl_jackal2.yaml, description: Replay preset configuration}
  # - let:
  #   name: config_path
  #   value: $(find-pkg-share s_slam_replay)/config/spark_fast_lio/kimera_multi/$(var replay_id).yaml

  - node:
      namespace: $(var replay_id)
      pkg: spark_fast_lio
      exec: spark_lio_mapping
      name: lio_mapping
      output: screen
      on_exit: shutdown

      remap:
        - { from: 'lidar', to: 'lidar_points' }
        - { from: 'imu',   to: 'forward/imu' }

      param:
        - name: "common.lidar_frame"
          value: "$(var replay_id)/$(var lidar_frame)"
        - name: "common.imu_frame"
          value: "$(var replay_id)/$(var imu_frame)"
        - name: "common.map_frame"
          value: "$(var replay_id)/$(var map_frame)"
        - name: "common.base_frame"
          value: "$(var replay_id)/$(var base_frame)"
        - name: "common.visualization_frame"
          value: "base"

        - name: "gravity_alignment.enable_gravity_alignment"
          value: false

        - from: $(find-pkg-share s_slam_replay)/config/spark_fast_lio/kimera_multi/$(var replay_id).yaml
