---
# Whole-system bring-up: spark_fast_lio front end + kiss_matcher_sam back end.
# This preset namespaces all topics/frames with replay_id, so the generic
# `s_slam_visualization` system.rviz does not match it; run RViz separately with a
# replay-prefixed config if you need it.
launch:
  # Deprecated compatibility aliases. Prefer replay_id in new commands.
  - arg: { name: scene_id,    default: "acl_jackal2", description: "Deprecated alias for replay_id" }
  - arg: { name: dataset_id,  default: "$(var scene_id)", description: "Deprecated alias for replay_id" }
  - arg: { name: replay_id,   default: "$(var dataset_id)", description: "Replay preset id and bag topic namespace" }
  - arg: { name: robot_name,  default: "acl_jackal2", description: "The actual robot used when acquiring data" }
  - arg: { name: sensor_type, default: "velodyne16", description: "KISS-Matcher replay sensor preset" }
  - arg: { name: save_map_pcd, default: "true", description: "Save accumulated map PCD when save_dir is triggered" }
  - arg: { name: save_in_kitti_format, default: "true", description: "Save keyframe scans plus poses_tum.txt and poses_kitti.txt when save_dir is triggered" }
  - arg: { name: result_seq_name, default: "$(var replay_id)", description: "Result directory name under the requested save_dir" }
  - arg: { name: save_voxel_resolution, default: "0.3", description: "Voxel resolution used for saved map PCD" }

  - include:
    # Please make sure to build SPARK-Fast-LIO first (see https://github.com/MIT-SPARK/spark-fast-lio).
      file: $(find-pkg-share s_slam_replay)/launch/mapping_kimera_multi.launch.yaml
      arg:
        - { name: replay_id, value: $(var replay_id) }
        - { name: robot_name, value: $(var robot_name) }

  - include:
      file: $(find-pkg-share kiss_matcher_ros)/launch/run_kiss_matcher_sam.launch.yaml
      arg:
        - { name: odom_topic, value: "/$(var replay_id)/odometry" }
        - { name: scan_topic, value: "/$(var replay_id)/cloud_registered" }
        - { name: map_frame, value: "$(var replay_id)/map" }
        - { name: base_frame, value: "$(var replay_id)/base_link" }
        - { name: namespace, value: $(var replay_id) }
        - { name: config_path, value: $(find-pkg-share s_slam_replay)/config/kiss_matcher/kimera_multi/$(var sensor_type).yaml }
        - { name: save_map_pcd, value: $(var save_map_pcd) }
        - { name: save_in_kitti_format, value: $(var save_in_kitti_format) }
        - { name: result_seq_name, value: $(var result_seq_name) }
        - { name: save_voxel_resolution, value: $(var save_voxel_resolution) }
