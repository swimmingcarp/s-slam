---
launch:
  - arg: {name: config_path, default: $(find-pkg-share s_slam_replay)/config/spark_fast_lio/ouster_vbr.yaml, description: Replay preset configuration}

  - node:
      pkg: spark_fast_lio
      exec: spark_lio_mapping
      name: lio_mapping
      output: screen
      on_exit: shutdown

      remap:
        - { from: 'lidar', to: '/ouster/points' }
        - { from: 'imu',   to: 'imu/data'   }

      param:
        - name: "common.lidar_frame"
          value: "os_sensor"
        - name: "common.imu_frame"
          value: "imu_link_ned"
        - name: "gravity_alignment.enable_gravity_alignment"
          value: false

        - from: $(var config_path)
