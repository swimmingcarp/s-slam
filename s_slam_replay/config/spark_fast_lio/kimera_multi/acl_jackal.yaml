/**:
  ros__parameters:
    common:
      lidar_qos_reliability: reliable
      imu_qos_reliability: reliable

    preprocess:
      lidar_type: 2               # 1 Livox, 2 Velodyne, 3 Ouster, 4 KM-Ouster, 5 RoboSense
      scan_line: 16
      scan_rate: 10               # only need to be set for velodyne, unit: Hz,
      timestamp_unit: 2           # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
      blind: 0.3
      blind_for_human_pilots: 1.6  # This parameter is to reject cloud points from human pilots

    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.003
      b_gyr_cov: 0.001
      fov_degree: 360.0
      det_range: 100.0
      extrinsic_est_enabled: false      # true: enable the online estimation of IMU-LiDAR extrinsic,

      extrinsic_T: [ 0.03774133, -0.1397553, -0.02366465 ]
      extrinsic_R: [-2.2592801129e-03, -9.9997471801e-01, -6.6821099000e-03,
                    -9.7530932003e-02, 6.8706218093e-03, -9.9520872367e-01,
                    9.9522979567e-01, -1.5967394876e-03, -9.7544025779e-02]

    filter_size_map: 0.3

    publish:
      path_enabled: true
      scan_publish_enabled: true        # false: close all the point cloud output
      dense_publish_enabled: true       # false: low down the points number in a global-frame point clouds scan.
      scan_lidar_frame_publish_enabled: true
      scan_body_frame_publish_enabled: true
      scan_base_frame_publish_enabled: true

    pcd_save:
      pcd_save_enabled: false
      interval: -1                 # how many LiDAR frames saved in each pcd file;
      # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

    verbose: false
    point_filter_num_for_preprocessing: 1 # If it is set to `1`, full point cloud gonna be publlished
    point_filter_num: 4                   # For pose estimation.
    max_iteration: 4
    cube_side_length: 1000.0
