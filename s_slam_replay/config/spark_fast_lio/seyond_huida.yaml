/**:
  ros__parameters:
    # Dataset preset: Huida vehicle calibration and replay-only initialization.
    # Do not use this configuration on a live vehicle.
    common:
      map_frame: odom
      base_frame: base_link
      imu_frame: base_link
      lidar_frame: lidar_link
      visualization_frame: base
      lidar_qos_reliability: reliable
      imu_qos_reliability: reliable
      imu_qos_depth: 1000

    preprocess:
      # Seyond Falcon's irregular scan pattern publishes scan_id rather than
      # a conventional ring. The adapter uses only x/y/z/intensity/timestamp.
      lidar_type: 6
      scan_line: 1
      scan_rate: 10
      timestamp_unit: 0
      blind: 1.5
      blind_for_human_pilots: 0.0

    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.003
      b_gyr_cov: 0.001
      fov_degree: 120.0
      det_range: 100.0  # Huida points reach about 90 m; do not use Falcon's advertised maximum range.
      extrinsic_est_enabled: false
      # /tf_static in huida_bag: base_link -> lidar_link. IMU messages use
      # base_link, so this is LiDAR w.r.t. IMU for FAST-LIO.
      extrinsic_T: [0.447, 0.0, -0.15]
      extrinsic_R: [0.9659258263, 0.0, -0.2588190451,
                    0.0, -1.0, 0.0,
                    -0.2588190451, 0.0, -0.9659258263]

    # This recording begins in motion. Dataset replay may initialize from its
    # finite IMU window; live operation still requires a stationary start.
    replay_mode: true

    filter_size_map: 0.3

    publish:
      path_enabled: true
      path_history_duration_sec: 600.0
      scan_publish_enabled: true
      dense_publish_enabled: true
      scan_lidar_frame_publish_enabled: true
      scan_body_frame_publish_enabled: true
      scan_base_frame_publish_enabled: false
      imu_predicted_odometry_enabled: false

    pcd_save:
      pcd_save_enabled: false
      interval: -1

    verbose: false
    point_filter_num_for_preprocessing: 1
    point_filter_num: 4
    max_iteration: 4
    cube_side_length: 1000.0
