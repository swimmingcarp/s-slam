---
launch:
  - arg: {name: start_rviz,   default: "true"}
  - arg: {name: config_path,  default: $(find-pkg-share kiss_matcher_ros)/config/params.yaml}
  - arg: {name: rviz_path,    default: $(find-pkg-share visualization)/rviz/kiss_matcher_reg.rviz}

  - node:
      pkg: kiss_matcher_ros
      exec: registration_visualizer
      name: registration_visualizer
      output: screen
      param:
        - from: $(var config_path)

  - node:
      if: $(var start_rviz)
      pkg: rviz2
      exec: rviz2
      name: rviz2
      output: screen
      args: >
        -d $(var rviz_path)
