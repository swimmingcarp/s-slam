/**:
  ros__parameters:
    common:
      # Keep all 200 Hz IMU samples while LiDAR matching/publishing is busy.
      # SensorDataQoS defaults to depth 5, which can drop IMU samples on Jetson.
      imu_qos_depth: 1000
      # The RoboSense driver publishes both inputs as RELIABLE. Keep the
      # frontend subscription compatible with the live sensor topics.
      lidar_qos_reliability: reliable
      imu_qos_reliability: reliable

    preprocess:
      lidar_type: 5               # 1 Livox, 2 Velodyne, 3 Ouster, 4 KM-Ouster, 5 RoboSense (Fairy)
      scan_line: 96               # Fairy has 96/48-beam variants. Use 48 if ring max is 47.
      scan_rate: 10               # Fairy spins at 600 RPM -> 10 Hz frame rate.
      timestamp_unit: 0           # IGNORED for RoboSense (the point cloud handler relativizes the absolute per-point timestamp).
      # TODO(device-bringup): tune after checking prop/frame returns in RViz.
      blind: 0.5                  # [m] reject self-returns (frame/props). Sensor min range is 0.1 m.
      blind_for_human_pilots: 0.0  # unused by the RoboSense point cloud handler (no human-pilot rejection on a UAV)

    mapping:
      # Runtime EKF process noise. acc_cov stays large: the Fairy accel has a real
      # -2.2% scale error and ~0.05 m/s^2 in-flight bias shifts, so LiDAR must own
      # position. gyr_cov must not be large: the gyro is measured excellent
      # (<0.6 deg attitude drift over 57 s dead-reckoning) and needs authority when
      # registration degrades (inverted flight, near-field-only returns).
      # gyr_cov=0.85 lost 75 deg attitude in inverted flight: live case 03 ended
      # 2.19 m from a 6 mm ICP-verified return point; 0.001 closes it at 0.09 m
      # with cases 00/01/02 unchanged. 0.0001 over-trusts the gyro and regresses
      # fast-yaw case 01 by 3x, so do not lower further without new evidence.
      acc_cov: 8.0
      gyr_cov: 0.001
      b_acc_cov: 0.001
      b_gyr_cov: 0.0001
      fov_degree: 360.0           # Fairy: 360 deg horizontal FOV
      det_range: 150.0            # Fairy max range. Tune lower if Jetson load or map quality requires it.
      extrinsic_est_enabled: false      # Fairy's built-in IMU has a fixed factory extrinsic.
      quality_gate_enabled: true
      # [m/s^2] Frame-mean IMU acceleration after gravity compensation; checked
      # before and after the LiDAR update.
      max_linear_acceleration: 8.0
      # [m/s] Maximum physical 3D vehicle speed. PX4 defaults allow 12 m/s
      # horizontally and 3 m/s upward, whose combined magnitude is 12.4 m/s.
      # Set this from the flight controller's actual velocity limits.
      max_linear_speed: 12.4
      # [m] LiDAR position adjustment relative to the IMU-propagated pose.
      max_lidar_position_adjustment: 0.15
      # LiDAR position adjustment / pose step during recovery; lower values are weak updates.
      min_recovery_lidar_adjustment_ratio: 0.20
      # Selected planar matches / downsampled scan points.
      min_matched_feature_ratio: 0.10
      # Minimum selected planar matches.
      min_matched_features: 20
      # Reject when the matched-feature count or ratio is below its threshold.
      reject_weak_lidar: true

      # ===== IMU <-> LiDAR extrinsic (LiDAR w.r.t. IMU) =====
      # The Fairy IMU is INTERNAL: this is a FIXED factory value, NOT flight/airframe dependent.
      # Read from Fairy DIFOP on Jetson:
      #   qx=-0.00114635, qy=-0.00195127, qz=-0.0112111, qw=0.999935
      #   x=0.01365, y=0.00782, z=0.00492
      # The DIFOP value is IMU relative to LiDAR; the values below are inverted for
      # FAST-LIO's LiDAR-w.r.t-IMU convention.
      extrinsic_T: [ -0.0134904954, -0.0081130535, -0.0048853042 ]
      extrinsic_R: [ 0.9997410078, -0.0224162506, 0.0039279868,
                     0.0224251980, 0.9997459944, -0.0022487974,
                    -0.0038765795, 0.0023363008, 0.9999897569 ]

    filter_size_map: 0.1          # [m] keep enough Fairy constraints; raise only if compute load requires it.

    publish:
      path_enabled: true
      path_history_duration_sec: 600.0  # Bound visualization history; full trajectory is recorded from /odometry.
      scan_publish_enabled: true
      dense_publish_enabled: true
      scan_lidar_frame_publish_enabled: true
      scan_body_frame_publish_enabled: true
      scan_base_frame_publish_enabled: false
      # High-rate IMU prediction is published on /odometry_imu_predicted; /odometry remains
      # the LiDAR-corrected state for mapping and RViz.
      imu_predicted_odometry_enabled: true

    pcd_save:
      pcd_save_enabled: false
      interval: -1

    verbose: false
    point_filter_num_for_preprocessing: 1
    # Stability-first default. Raise only if Jetson cannot keep up with the LiDAR frame rate.
    point_filter_num: 1
    max_iteration: 3              # EKF iterations (lower for Jetson real-time)
    cube_side_length: 1000.0
