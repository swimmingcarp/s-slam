---
launch:
  - arg:
      name: config_path
      default: $(find-pkg-share s_slam_px4_bridge)/config/px4_odometry_bridge.yaml

  - node:
      pkg: s_slam_px4_bridge
      exec: px4_odometry_bridge
      name: px4_odometry_bridge
      output: screen
      param:
        - from: $(var config_path)
